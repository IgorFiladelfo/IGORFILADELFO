<svg xmlns="http://www.w3.org/2000/svg" width="240" height="52" viewBox="0 0 240 52" role="img" aria-label="LINKEDIN">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- transparent exterior -->
  <g filter="url(#glow)">
    <path d="M10 10h6V4h208v6h6v6h6v20h-6v6h-6v6H16v-6h-6v-6H4V16h6z" fill="#0e0e0f"/>
    <path d="M16 14h6V8h196v6h6v6h6v12h-6v6h-6v6H22v-6h-6v-6h-6V20h6z" fill="#0077B5"/>
    <rect x="24" y="16" width="192" height="20" fill="#0077B5"/>
    <rect x="24" y="16" width="192" height="20" fill="url(#scan)" opacity="0.35"/>
  </g>

  <!-- moving pixel runner -->
  <rect x="28" y="18" width="4" height="4" fill="#5fc7ff">
    <animate attributeName="x" values="28;208;28" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="208" y="30" width="4" height="4" fill="#ffffff">
    <animate attributeName="x" values="208;28;208" dur="3.9s" repeatCount="indefinite"/>
  </rect>

  <!-- tiny corner spark pixels -->
  <g fill="#ffffff">
    <rect x="30" y="20" width="3" height="3"><animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="206" y="28" width="3" height="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- mini pixel icon -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="36" y="22" width="4" height="4"/>
    <rect x="40" y="18" width="4" height="4"/>
    <rect x="40" y="26" width="4" height="4"/>
    <rect x="44" y="22" width="4" height="4"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <text x="132" y="30" text-anchor="middle" fill="#ffffff"
        font-family="'Courier New', monospace" font-size="16" font-weight="900" letter-spacing="1.2"
        style="paint-order: stroke; stroke: rgba(0,0,0,0.15); stroke-width: 0.8px;">
    LINKEDIN
    <animate attributeName="opacity" values="1;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
