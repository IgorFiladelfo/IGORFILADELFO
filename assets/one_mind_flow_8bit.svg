<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="One mind flow">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect width="4" height="1" y="0" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- transparent background -->

  <g fill="#ff7a00">
    <rect x="20" y="20" width="8" height="24"/>
    <rect x="28" y="24" width="8" height="16"/>
    <rect x="972" y="20" width="8" height="24"/>
    <rect x="964" y="24" width="8" height="16"/>
  </g>

  <rect x="36" y="16" width="928" height="32" rx="0" fill="#ff7a00" filter="url(#glow)"/>
  <rect x="36" y="16" width="928" height="32" fill="url(#scan)" opacity="0.45"/>

  <!-- animated tiny arrows for retro flow vibe -->
  <g fill="#ffe1bf" opacity="0.95">
    <g>
      <rect x="80" y="26" width="6" height="6"/>
      <rect x="88" y="22" width="6" height="6"/>
      <rect x="88" y="30" width="6" height="6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 780 0; 0 0" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="914" y="32" width="6" height="6"/>
      <rect x="906" y="28" width="6" height="6"/>
      <rect x="906" y="36" width="6" height="6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -780 0; 0 0" dur="4.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#ffffff">
    <rect x="48" y="18" width="4" height="4"><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="948" y="42" width="4" height="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="938" y="18" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="58" y="42" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></rect>
  </g>

  <text x="500" y="39" text-anchor="middle" fill="#ffffff"
        font-family="'Courier New', monospace" font-size="22" font-weight="700"
        letter-spacing="0.8">
    ONE MIND FLOW
    <animate attributeName="opacity" values="1;0.92;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
</svg>
