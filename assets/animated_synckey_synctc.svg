<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Synckey conectado ao Synctc">
<defs>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation=".7" result="tb"/>
    <feMerge><feMergeNode in="tb"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .o{fill:none;stroke:#FF7A00;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
    .pix{fill:#FFFFFF;filter:url(#textGlow)}
    .spark{fill:#FF7A00}
    .glow{filter:url(#softGlow)}
    .runner{fill:none;stroke:#FFD0A8;stroke-width:3;stroke-dasharray:22 820;animation:run 4.2s linear infinite}
    .runner2{fill:none;stroke:#FFD0A8;stroke-width:3;stroke-dasharray:18 824;animation:run 4.2s linear 1s infinite}
    .flicker{animation:flicker 2.3s steps(1,end) infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .panelFill{fill:#0D1117}
    @keyframes run{to{stroke-dashoffset:-842}}
    @keyframes flicker{0%,70%,82%,100%{opacity:1}72%,80%{opacity:.22}}
    @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.runner,.runner2,.flicker,.pulse{animation:none}}
  </style>
</defs>

<!-- transparent canvas -->

