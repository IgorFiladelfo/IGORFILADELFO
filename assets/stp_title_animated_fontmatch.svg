<svg xmlns="http://www.w3.org/2000/svg" width="1684" height="228" viewBox="58 66 1684 228" role="img" aria-label="STP — System That Performs">
  <defs>
    <clipPath id="plaqueClip">
      <path d="M80 88h14v-14h1612v14h14v14h14v156h-14v14h-14v14H94v-14H80v-14H66V102h14z"/>
    </clipPath>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="orangeGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffb11a"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>

    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <rect width="8" height="2" y="0" fill="#000000" opacity="0.05"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 8;0 0" dur="2.2s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <!-- stepped plaque with transparent exterior -->
  <g filter="url(#softGlow)">
    <path d="M72 80h14V66h1628v14h14v14h14v172h-14v14h-14v14H86v-14H72v-14H58V94h14z" fill="#101010"/>
    <path d="M88 96h14V82h1596v14h14v14h14v140h-14v14h-14v14H102v-14H88v-14H74V110h14z" fill="#ff7a00"/>
    <path d="M104 112h14V98h1564v14h14v14h14v108h-14v14h-14v14H118v-14h-14v-14H90V126h14z" fill="#111111"/>
    <path d="M120 128h14v-14h1532v14h14v14h14v76h-14v14h-14v14H134v-14h-14v-14h-14v-76h14z" fill="#f7f7f7"/>
  </g>

  <g clip-path="url(#plaqueClip)">
    <rect x="106" y="114" width="1588" height="132" fill="url(#scanlines)"/>

    <rect x="-240" y="114" width="240" height="132" fill="#ffffff" opacity="0.16" transform="skewX(-18)">
      <animate attributeName="x" values="-320;1900" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0.33" fill="#8a8a8a">
      <rect x="190" y="146" width="320" height="8"/>
      <rect x="1330" y="146" width="300" height="8"/>
      <rect x="190" y="206" width="320" height="8"/>
      <rect x="1330" y="206" width="300" height="8"/>
      <animate attributeName="opacity" values="0.22;0.42;0.22" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <g fill="#ff7a00" opacity="0.75">
      <g transform="translate(885 138)">
        <rect x="0" y="0" width="14" height="42" transform="skewX(-20)"/>
        <rect x="28" y="0" width="14" height="42" transform="skewX(-20)"/>
        <rect x="56" y="0" width="14" height="42" transform="skewX(-20)"/>
        <animate attributeName="opacity" values="0.45;0.95;0.45" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(885 182)">
        <rect x="0" y="0" width="14" height="42" transform="skewX(-20)"/>
        <rect x="28" y="0" width="14" height="42" transform="skewX(-20)"/>
        <rect x="56" y="0" width="14" height="42" transform="skewX(-20)"/>
        <animate attributeName="opacity" values="0.95;0.38;0.95" dur="1.25s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- title with slab/arcade serif feeling matching SOFTWARE ENGINEER sample -->
    <text x="900" y="180"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="'Courier New', Courier, monospace"
          font-size="78"
          font-weight="900"
          letter-spacing="1.5"
          fill="url(#orangeGrad)"
          stroke="#111111"
          stroke-width="10"
          stroke-linejoin="round"
          paint-order="stroke fill">
      STP — SYSTEM THAT PERFORMS
      <animate attributeName="opacity" values="1;0.965;1" dur="1.15s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#111111">
    <rect x="95" y="108" width="34" height="34"/>
    <rect x="1671" y="108" width="34" height="34"/>
    <rect x="95" y="218" width="34" height="34"/>
    <rect x="1671" y="218" width="34" height="34"/>
  </g>
  <g fill="#ffb11a">
    <rect x="103" y="116" width="18" height="18"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="1679" y="116" width="18" height="18"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="103" y="226" width="18" height="18"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="1679" y="226" width="18" height="18"><animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/></rect>
  </g>

  <g fill="#ffb11a">
    <g transform="translate(156 170)">
      <rect x="12" y="0" width="12" height="48"/>
      <rect x="0" y="18" width="36" height="12"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1608 170)">
      <rect x="12" y="0" width="12" height="48"/>
      <rect x="0" y="18" width="36" height="12"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(156 116) scale(0.72)">
      <rect x="12" y="0" width="12" height="48"/>
      <rect x="0" y="18" width="36" height="12"/>
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1608 116) scale(0.72)">
      <rect x="12" y="0" width="12" height="48"/>
      <rect x="0" y="18" width="36" height="12"/>
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
