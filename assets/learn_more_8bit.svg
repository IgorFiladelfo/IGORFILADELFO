<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Learn more">
  <defs>
    <filter id="orangeGlow" x="-20%" y="-35%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orange{fill:#FF7A00}
      .frame{fill:#0D1117;stroke:#FF7A00;stroke-width:9;stroke-linejoin:miter}
      .side{fill:none;stroke:#FF7A00;stroke-width:7;stroke-linecap:square}
      .runner{fill:none;stroke:#FFD0A8;stroke-width:4;stroke-dasharray:34 940;animation:run 4s linear infinite}
      .pixel{fill:#FFFFFF;shape-rendering:crispEdges}
      .flicker{animation:flicker 2.8s steps(1,end) infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes run{to{stroke-dashoffset:-974}}
      @keyframes flicker{0%,72%,100%{opacity:1}73%,78%{opacity:.35}}
      @keyframes pulse{0%,100%{opacity:.88}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.runner,.flicker,.pulse{animation:none}}
    </style>
  </defs>

  <g filter="url(#orangeGlow)" class="pulse">
    <!-- main octagonal frame -->
    <path class="frame" d="M344 58H856L902 104V196L856 242H344L298 196V104Z"/>
    <path class="side" d="M344 44H856M282 104V196M918 104V196" opacity=".9"/>
    <path class="runner" d="M344 58H856L902 104V196L856 242H344L298 196V104Z"/>

    <!-- upper connector tab -->
    <rect class="orange" x="576" y="30" width="48" height="28"/>

    <!-- left pixel ornaments -->
    <g class="flicker">
      <rect class="orange" x="252" y="62" width="22" height="22"/>
      <rect class="orange" x="224" y="104" width="22" height="22"/>
      <rect class="orange" x="252" y="216" width="22" height="22"/>
      <rect class="orange" x="224" y="174" width="22" height="22"/>
    </g>

    <!-- right pixel ornaments -->
    <g class="flicker">
      <rect class="orange" x="926" y="62" width="22" height="22"/>
      <rect class="orange" x="954" y="104" width="22" height="22"/>
      <rect class="orange" x="926" y="216" width="22" height="22"/>
      <rect class="orange" x="954" y="174" width="22" height="22"/>
    </g>

